<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <title>每日单词 · 2027 考研英语二</title>
  <meta name="description" content="专注浏览每日考研英语二单词，支持日期、筛选、发音与显示设置。" />
  <script>
    (() => {
      try {
        const root = document.documentElement;
        const theme = localStorage.getItem('daily-words:theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        const saved = JSON.parse(localStorage.getItem('daily-words:display-v2') || '{}');
        root.dataset.theme = theme;
        root.style.setProperty('--ui-scale', ((Number(saved.uiScale) || 108) / 100).toFixed(2));
        root.style.setProperty('--word-scale', ((Number(saved.wordScale) || 108) / 100).toFixed(2));
        root.style.setProperty('--card-min', `${Number(saved.cardMin) || 310}px`);
        root.style.setProperty('--card-pad', `${Number(saved.cardPadding) || 22}px`);
      } catch (_) {}
    })();
  </script>
  <link rel="stylesheet" href="./styles.css?v=focus-1" />
</head>
<body>
  <div class="app-shell">
    <header class="focusbar">
      <div class="focus-left">
        <span class="brand-mark" aria-hidden="true">D</span>
        <button class="date-summary" id="toolsToggle" type="button" aria-expanded="false" aria-controls="toolsPanel">
          <strong id="focusDate">9月15日</strong>
          <span id="focusMeta">Day 62 · 70词</span>
        </button>
      </div>
      <div class="focus-progress" aria-label="今日学习进度">
        <span class="focus-progress-track"><span id="focusProgressFill"></span></span>
        <span id="focusProgressText">0 / 70</span>
      </div>
      <div class="focus-actions">
        <button class="icon-action" id="meaningToggle" type="button" aria-label="隐藏释义" title="隐藏/显示释义"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.8"/></svg></button>
        <button class="icon-action" id="toolsBtn" type="button" aria-label="打开学习工具" title="学习工具" aria-expanded="false" aria-controls="toolsPanel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M8 4v6M8 14v6M16 4v6M16 14v6"/></svg></button>
        <button class="icon-action" id="settingsBtn" type="button" aria-label="打开显示设置" title="显示设置"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .9l-.03.08H10l-.03-.08a1.7 1.7 0 0 0-1-.9 1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.9-1l-.08-.03V10l.08-.03a1.7 1.7 0 0 0 .9-1 1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.9l.03-.08H14l.03.08a1.7 1.7 0 0 0 1 .9 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.1.4.42.77.9 1l.08.03V14l-.08.03a1.7 1.7 0 0 0-.9.97Z"/></svg></button>
      </div>
    </header>
    <section class="tools-panel" id="toolsPanel" aria-hidden="true">
      <div class="tools-inner">
        <div class="tool-row date-tools"><button class="tool-button square" id="prevDay" type="button" aria-label="上一天">←</button><div class="date-strip" id="dateStrip"></div><button class="tool-button square" id="nextDay" type="button" aria-label="下一天">→</button></div>
        <div class="tool-row tool-controls"><div class="search-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg><input id="searchInput" type="search" placeholder="搜索单词或释义" autocomplete="off" /></div><div class="filters" id="filters"><button class="filter active" data-filter="all" type="button">全部</button><button class="filter" data-filter="A" type="button">A 高频</button><button class="filter" data-filter="B" type="button">B 核心</button><button class="filter" data-filter="C" type="button">C 中频</button><button class="filter" data-filter="D" type="button">D 认读</button><button class="filter" data-filter="unlearned" type="button">未掌握</button></div></div>
        <div class="tool-row utility-row"><label class="date-control" aria-label="选择日期"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v3M17 3v3M4 9h16M5 5h14a1 1 0 0 1 1 1v14H4V6a1 1 0 0 1 1-1Z"/></svg><input id="dateInput" type="date" /></label><button class="tool-button" id="todayBtn" type="button">今天</button><button class="tool-button" id="continueBtn" type="button">继续学习</button><div class="mini-stats"><span><b id="doneCount">0</b> 已掌握</span><span><b id="remainCount">70</b> 待学习</span><span><b id="resultCount">70</b> 当前显示</span></div></div>
      </div>
    </section>
    <main class="content"><section class="word-grid" id="wordGrid" aria-live="polite"></section><section class="empty-state hidden" id="emptyState"><div class="rest-icon">—</div><h2 id="emptyTitle">今天是休息日</h2><p id="emptyText">不安排新词，保持轻量复习即可。</p></section></main>
  </div>
  <div class="overlay" id="overlay"></div>
  <aside class="settings-panel" id="settingsPanel" aria-hidden="true">
    <div class="settings-head"><div><h2>显示设置</h2><p>只调整阅读体验，不影响学习数据。</p></div><button class="icon-action" id="closeSettingsBtn" type="button" aria-label="关闭设置"><svg viewBox="0 0 24 24"><path d="M6 6 18 18M18 6 6 18"/></svg></button></div>
    <div class="settings-body"><section class="setting-group"><h3>主题</h3><div class="theme-switch"><button class="theme-option" data-theme-choice="light" type="button">浅色</button><button class="theme-option" data-theme-choice="dark" type="button">深色</button></div></section><section class="setting-group"><h3>文字与界面</h3><label class="setting-row"><span><b>界面大小</b><em id="uiScaleValue">108%</em></span><input id="uiScaleInput" type="range" min="90" max="130" step="2" /></label><label class="setting-row"><span><b>单词与释义</b><em id="wordScaleValue">108%</em></span><input id="wordScaleInput" type="range" min="95" max="145" step="2" /></label></section><section class="setting-group"><h3>卡片</h3><label class="setting-row"><span><b>卡片宽度</b><em id="cardMinValue">310 px</em></span><input id="cardMinInput" type="range" min="250" max="460" step="10" /></label><label class="setting-row"><span><b>卡片留白</b><em id="cardPaddingValue">22 px</em></span><input id="cardPaddingInput" type="range" min="16" max="34" step="2" /></label></section><button class="reset-button" id="resetDisplayBtn" type="button">恢复默认显示</button></div>
  </aside>
  <script src="./words-data.js?v=20260915-2"></script>
  <script src="./app.js?v=focus-1"></script>
</body>
</html>
