<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex" />
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex" />
  <meta name="bingbot" content="noindex,nofollow,noarchive,nosnippet,noimageindex" />
  <meta name="referrer" content="no-referrer" />
  <title>DW</title>
  <script>
    (()=>{try{const r=document.documentElement;const t=localStorage.getItem('daily-words:theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');const s=JSON.parse(localStorage.getItem('daily-words:display-v2')||'{}');r.dataset.theme=t;r.style.setProperty('--ui-scale',((Number(s.uiScale)||108)/100).toFixed(2));r.style.setProperty('--word-scale',((Number(s.wordScale)||108)/100).toFixed(2));r.style.setProperty('--card-min',`${Number(s.cardMin)||310}px`);r.style.setProperty('--card-pad',`${Number(s.cardPadding)||22}px`)}catch(_){}})();
  </script>
  <link rel="stylesheet" href="./styles.css?v=20260918-1" />
  <link rel="stylesheet" href="./quiz.css?v=20260918-1" />
</head>
<body>
  <div class="app-shell">
    <header class="focusbar">
      <div class="focus-left">
        <span class="brand-mark" aria-hidden="true">D</span>
        <button class="date-summary" id="toolsToggle" type="button" aria-expanded="false" aria-controls="toolsPanel">
          <strong id="focusDate">—</strong><span id="focusMeta">—</span>
        </button>
      </div>
      <div class="focus-progress" aria-label="今日学习进度"><span class="focus-progress-track"><span id="focusProgressFill"></span></span><span id="focusProgressText">0 / 0</span></div>
      <div class="focus-actions">
        <button class="icon-action random-top-action" id="randomBtn" type="button" aria-label="随机抽查" title="随机抽查"><svg viewBox="0 0 24 24"><path d="M4 7h3c4 0 5 10 9 10h4M17 4l3 3-3 3M4 17h3c1.7 0 2.8-1.8 3.8-4M17 14l3 3-3 3"/></svg></button>
        <button class="icon-action" id="meaningToggle" type="button" aria-label="隐藏释义" title="隐藏/显示释义"><svg viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.8"/></svg></button>
        <button class="icon-action" id="toolsBtn" type="button" aria-label="打开学习工具" title="学习工具" aria-expanded="false" aria-controls="toolsPanel"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M8 4v6M8 14v6M16 4v6M16 14v6"/></svg></button>
        <button class="icon-action" id="settingsBtn" type="button" aria-label="打开显示设置" title="显示设置"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .9l-.03.08H10l-.03-.08a1.7 1.7 0 0 0-1-.9 1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.9-1l-.08-.03V10l.08-.03a1.7 1.7 0 0 0 .9-1 1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.9l.03-.08H14l.03.08a1.7 1.7 0 0 0 1 .9 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.1.4.42.77.9 1l.08.03V14l-.08.03a1.7 1.7 0 0 0-.9.97Z"/></svg></button>
      </div>
    </header>
    <section class="tools-panel" id="toolsPanel" aria-hidden="true"><div class="tools-inner">
      <div class="tool-row date-tools"><button class="tool-button square" id="prevDay" type="button">←</button><div class="date-strip" id="dateStrip"></div><button class="tool-button square" id="nextDay" type="button">→</button></div>
      <div class="tool-row tool-controls"><div class="search-wrap"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg><input id="searchInput" type="search" placeholder="搜索" autocomplete="off" /></div><div class="filters" id="filters"><button class="filter active" data-filter="all">全部</button><button class="filter" data-filter="A">A 高频</button><button class="filter" data-filter="B">B 核心</button><button class="filter" data-filter="C">C 中频</button><button class="filter" data-filter="D">D 认读</button><button class="filter" data-filter="unlearned">未掌握</button></div></div>
      <div class="tool-row utility-row"><label class="date-control"><svg viewBox="0 0 24 24"><path d="M7 3v3M17 3v3M4 9h16M5 5h14a1 1 0 0 1 1 1v14H4V6a1 1 0 0 1 1-1Z"/></svg><input id="dateInput" type="date" /></label><button class="tool-button" id="todayBtn">今天</button><button class="tool-button" id="continueBtn">继续学习</button><div class="mini-stats"><span><b id="doneCount">0</b> 已掌握</span><span><b id="remainCount">0</b> 待学习</span><span><b id="resultCount">0</b> 当前显示</span></div></div>
    </div></section>
    <main class="content"><section class="word-grid" id="wordGrid" aria-live="polite"></section><section class="empty-state hidden" id="emptyState"><div class="rest-icon">—</div><h2 id="emptyTitle">暂无内容</h2><p id="emptyText">切换日期后继续。</p></section></main>
  </div>

  <div class="overlay" id="overlay"></div>
  <aside class="settings-panel" id="settingsPanel" aria-hidden="true"><div class="settings-head"><div><h2>显示设置</h2><p>只调整阅读体验。</p></div><button class="icon-action" id="closeSettingsBtn" type="button"><svg viewBox="0 0 24 24"><path d="M6 6 18 18M18 6 6 18"/></svg></button></div><div class="settings-body">
    <section class="setting-group"><h3>主题</h3><div class="theme-switch"><button class="theme-option" data-theme-choice="light">浅色</button><button class="theme-option" data-theme-choice="dark">深色</button></div></section>
    <section class="setting-group"><h3>文字与界面</h3><label class="setting-row"><span><b>界面大小</b><em id="uiScaleValue">108%</em></span><input id="uiScaleInput" type="range" min="90" max="130" step="2" /></label><label class="setting-row"><span><b>单词与释义</b><em id="wordScaleValue">108%</em></span><input id="wordScaleInput" type="range" min="95" max="145" step="2" /></label></section>
    <section class="setting-group"><h3>卡片</h3><label class="setting-row"><span><b>卡片宽度</b><em id="cardMinValue">310 px</em></span><input id="cardMinInput" type="range" min="250" max="460" step="10" /></label><label class="setting-row"><span><b>卡片留白</b><em id="cardPaddingValue">22 px</em></span><input id="cardPaddingInput" type="range" min="16" max="34" step="2" /></label></section>
    <button class="reset-button" id="resetDisplayBtn">恢复默认显示</button>
  </div></aside>

  <section class="random-panel" id="randomPanel" aria-hidden="true">
    <header class="random-head"><div><h2>随机抽查</h2><p>一次 1 个单词 · 先回忆，再看释义</p></div><button class="icon-action" id="closeRandomBtn" type="button" aria-label="关闭抽查"><svg viewBox="0 0 24 24"><path d="M6 6 18 18M18 6 6 18"/></svg></button></header>
    <div class="random-source"><button class="source-option active" data-random-source="day">当天词表</button><button class="source-option" data-random-source="all">全部词库</button></div>
    <div class="random-body">
      <div class="random-stats"><span><b id="randomTotal">0</b> 已抽查</span><span><b id="randomKnown">0</b> 认识</span><span><b id="randomUnknown">0</b> 不认识</span></div>
      <article class="quiz-card" id="quizCard"><div class="quiz-label" id="randomSourceLabel">当天词表</div><button class="quiz-speak" id="randomSpeakBtn" type="button" aria-label="朗读"><svg viewBox="0 0 24 24"><path d="M5 10v4h4l5 4V6L9 10H5Z"/><path d="M17 9c1 .8 1.5 1.8 1.5 3S18 14.2 17 15"/><path d="M19 6.5c1.7 1.4 2.5 3.2 2.5 5.5S20.7 16.1 19 17.5"/></svg></button><h3 id="randomWord">—</h3><div class="quiz-answer"><span id="randomPos">—</span><p id="randomMeaning">—</p></div></article>
      <div class="quiz-actions"><button class="reveal-button" id="revealBtn">显示释义</button><div class="judge-actions hidden" id="judgeActions"><button class="judge-button known" id="knownBtn">认识</button><button class="judge-button unknown" id="unknownBtn">不认识</button></div></div>
      <button class="skip-button" id="skipBtn">换一个</button>
    </div>
  </section>

  <script src="./words-data.js?v=20260918-1"></script>
  <script src="./speech.js?v=20260918-1"></script>
  <script src="./app.js?v=20260918-1"></script>
  <script src="./random.js?v=20260918-1"></script>
</body>
</html>
