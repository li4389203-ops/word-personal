<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <title>每日单词 · 2027 考研英语二</title>
  <meta name="description" content="专注浏览每日考研英语二单词，支持随机抽查、日期、筛选、发音与显示设置。" />
  <script>
    (() => {
      try {
        const root = document.documentElement;
        const theme = localStorage.getItem('daily-words:theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        const saved = JSON.parse(localStorage.getItem('daily-words:display-v2') || '{}');
        root.dataset.theme = theme;
        root.style.setProperty('--ui-scale', ((Number(saved.uiScale) || 108) / 100).toFixed(2));
        root.style.setProperty('--word-scale', ((Number(saved.wordScale) || 108) / 100).toFixed(2));
        root.style.setProperty('--card-min', `${Number(saved.cardMin) || 310}px`);
        root.style.setProperty('--card-pad', `${Number(saved.cardPadding) || 22}px`);
      } catch (_) {}
    })();
  </script>
  <link rel="stylesheet" href="./styles.css?v=random-2" />

  <style>
.random-top-action{position:relative}.random-top-action::after{content:"";position:absolute;right:5px;top:5px;width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--panel)}.random-entry{display:inline-flex;align-items:center;gap:8px;font-weight:700}.random-entry svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.random-overlay{position:fixed;inset:0;z-index:60;background:var(--overlay);opacity:0;pointer-events:none;transition:.2s ease}.random-overlay.show{opacity:1;pointer-events:auto}.random-panel{position:fixed;inset:clamp(10px,3vw,28px);z-index:70;background:var(--bg);border:1px solid var(--line);border-radius:24px;box-shadow:0 26px 80px rgba(0,0,0,.24);opacity:0;pointer-events:none;transform:scale(.985);transition:.2s ease;display:flex;flex-direction:column;overflow:hidden}.random-panel.show{opacity:1;pointer-events:auto;transform:scale(1)}body.random-open{overflow:hidden}.random-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding:18px 20px 14px;border-bottom:1px solid var(--line);background:var(--panel)}.random-head h2{margin:0;font-size:1.08rem}.random-head p{margin:5px 0 0;color:var(--muted);font-size:.76rem}.random-source{display:flex;gap:7px;padding:12px 20px 0;background:var(--bg)}.source-option{min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--muted);cursor:pointer}.source-option.active{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}.random-body{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:16px;overflow:auto}.random-stats{display:flex;align-items:center;gap:18px;color:var(--muted);font-size:.78rem}.random-stats b{color:var(--text);font-size:.9rem}.quiz-card{position:relative;width:min(720px,100%);min-height:min(48vh,430px);padding:clamp(28px,6vw,64px);border:1px solid var(--line);border-radius:24px;background:var(--panel);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.quiz-label{font-size:.72rem;color:var(--muted);letter-spacing:.03em}.quiz-card h3{margin:18px 0 0;font-size:clamp(2.7rem,8vw,5.8rem);line-height:.98;letter-spacing:-.055em;word-break:break-word}.quiz-speak{position:absolute;right:16px;top:16px;width:46px;height:46px;border:1px solid var(--line);border-radius:14px;background:var(--panel-2);display:grid;place-items:center;color:var(--text-2);cursor:pointer}.quiz-speak svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.quiz-answer{max-width:620px;margin-top:26px;opacity:0;transform:translateY(8px);pointer-events:none;transition:.18s ease}.quiz-card.revealed .quiz-answer{opacity:1;transform:translateY(0);pointer-events:auto}.quiz-answer span{display:inline-flex;min-height:26px;align-items:center;padding:0 9px;border:1px solid var(--line);border-radius:999px;background:var(--panel-2);color:var(--muted);font-size:.76rem}.quiz-answer p{margin:12px 0 0;color:var(--text-2);font-size:clamp(1.05rem,2.3vw,1.4rem);line-height:1.65}.quiz-actions{width:min(720px,100%)}.reveal-button,.judge-button{width:100%;min-height:56px;border-radius:16px;font-weight:750;cursor:pointer}.reveal-button{border:0;background:var(--accent);color:var(--accent-text)}.judge-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.judge-button{border:1px solid var(--line);background:var(--panel)}.judge-button.known{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}.judge-button.unknown{color:var(--text-2)}.skip-button{border:0;background:transparent;color:var(--muted);min-height:36px;padding:0 14px;cursor:pointer}.skip-button:hover{color:var(--text)}@media(max-width:640px){.random-panel{inset:0;border-radius:0;border:0}.random-head{padding:calc(14px + var(--safe-top)) 14px 12px}.random-source{padding:10px 14px 0}.random-body{padding:14px 14px calc(14px + var(--safe-bottom));gap:12px}.random-stats{width:100%;justify-content:space-between;gap:8px}.quiz-card{min-height:48vh;padding:30px 18px;border-radius:20px}.quiz-card h3{font-size:clamp(2.5rem,14vw,4.5rem)}.quiz-answer{margin-top:22px}.reveal-button,.judge-button{min-height:58px}.judge-actions{gap:8px}}
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="focusbar">
      <div class="focus-left">
        <span class="brand-mark" aria-hidden="true">D</span>
        <button class="date-summary" id="toolsToggle" type="button" aria-expanded="false" aria-controls="toolsPanel">
          <strong id="focusDate">9月16日</strong>
          <span id="focusMeta">Day 63 · 66词</span>
        </button>
      </div>
      <div class="focus-progress" aria-label="今日学习进度">
        <span class="focus-progress-track"><span id="focusProgressFill"></span></span>
        <span id="focusProgressText">0 / 66</span>
      </div>
      <div class="focus-actions">
        <button class="icon-action random-top-action" id="randomBtn" type="button" aria-label="随机抽查" title="随机抽查"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h3c4 0 5 10 9 10h4M17 4l3 3-3 3M4 17h3c1.7 0 2.8-1.8 3.8-4M17 14l3 3-3 3"/></svg></button>
        <button class="icon-action" id="meaningToggle" type="button" aria-label="隐藏释义" title="隐藏/显示释义"><svg viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.8"/></svg></button>
        <button class="icon-action" id="toolsBtn" type="button" aria-label="打开学习工具" title="学习工具" aria-expanded="false" aria-controls="toolsPanel"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M8 4v6M8 14v6M16 4v6M16 14v6"/></svg></button>
        <button class="icon-action" id="settingsBtn" type="button" aria-label="打开显示设置" title="显示设置"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .9l-.03.08H10l-.03-.08a1.7 1.7 0 0 0-1-.9 1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.9-1l-.08-.03V10l.08-.03a1.7 1.7 0 0 0 .9-1 1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.9l.03-.08H14l.03.08a1.7 1.7 0 0 0 1 .9 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.1.4.42.77.9 1l.08.03V14l-.08.03a1.7 1.7 0 0 0-.9.97Z"/></svg></button>
      </div>
    </header>

    <section class="tools-panel" id="toolsPanel" aria-hidden="true">
      <div class="tools-inner">
        <div class="tool-row date-tools"><button class="tool-button square" id="prevDay" type="button" aria-label="上一天">←</button><div class="date-strip" id="dateStrip"></div><button class="tool-button square" id="nextDay" type="button" aria-label="下一天">→</button></div>
        <div class="tool-row tool-controls"><div class="search-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg><input id="searchInput" type="search" placeholder="搜索单词或释义" autocomplete="off" /></div><div class="filters" id="filters"><button class="filter active" data-filter="all" type="button">全部</button><button class="filter" data-filter="A" type="button">A 高频</button><button class="filter" data-filter="B" type="button">B 核心</button><button class="filter" data-filter="C" type="button">C 中频</button><button class="filter" data-filter="D" type="button">D 认读</button><button class="filter" data-filter="unlearned" type="button">未掌握</button></div></div>
        <div class="tool-row utility-row"><label class="date-control" aria-label="选择日期"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v3M17 3v3M4 9h16M5 5h14a1 1 0 0 1 1 1v14H4V6a1 1 0 0 1 1-1Z"/></svg><input id="dateInput" type="date" /></label><button class="tool-button" id="todayBtn" type="button">今天</button><button class="tool-button" id="continueBtn" type="button">继续学习</button><div class="mini-stats"><span><b id="doneCount">0</b> 已掌握</span><span><b id="remainCount">66</b> 待学习</span><span><b id="resultCount">66</b> 当前显示</span></div></div>
      </div>
    </section>

    <main class="content"><section class="word-grid" id="wordGrid" aria-live="polite"></section><section class="empty-state hidden" id="emptyState"><div class="rest-icon">—</div><h2 id="emptyTitle">今天是休息日</h2><p id="emptyText">不安排新词，保持轻量复习即可。</p></section></main>
  </div>

  <div class="overlay" id="overlay"></div>
  <aside class="settings-panel" id="settingsPanel" aria-hidden="true">
    <div class="settings-head"><div><h2>显示设置</h2><p>只调整阅读体验，不影响学习数据。</p></div><button class="icon-action" id="closeSettingsBtn" type="button" aria-label="关闭设置"><svg viewBox="0 0 24 24"><path d="M6 6 18 18M18 6 6 18"/></svg></button></div>
    <div class="settings-body"><section class="setting-group"><h3>主题</h3><div class="theme-switch"><button class="theme-option" data-theme-choice="light" type="button">浅色</button><button class="theme-option" data-theme-choice="dark" type="button">深色</button></div></section><section class="setting-group"><h3>文字与界面</h3><label class="setting-row"><span><b>界面大小</b><em id="uiScaleValue">108%</em></span><input id="uiScaleInput" type="range" min="90" max="130" step="2" /></label><label class="setting-row"><span><b>单词与释义</b><em id="wordScaleValue">108%</em></span><input id="wordScaleInput" type="range" min="95" max="145" step="2" /></label></section><section class="setting-group"><h3>卡片</h3><label class="setting-row"><span><b>卡片宽度</b><em id="cardMinValue">310 px</em></span><input id="cardMinInput" type="range" min="250" max="460" step="10" /></label><label class="setting-row"><span><b>卡片留白</b><em id="cardPaddingValue">22 px</em></span><input id="cardPaddingInput" type="range" min="16" max="34" step="2" /></label></section><button class="reset-button" id="resetDisplayBtn" type="button">恢复默认显示</button></div>
  </aside>

  <div class="random-overlay" id="randomOverlay"></div>
  <section class="random-panel" id="randomPanel" aria-hidden="true">
    <header class="random-head"><div><h2>随机抽查</h2><p>一次 1 个单词 · 先回忆，再看释义</p></div><button class="icon-action" id="closeRandomBtn" type="button" aria-label="关闭随机抽查"><svg viewBox="0 0 24 24"><path d="M6 6 18 18M18 6 6 18"/></svg></button></header>
    <div class="random-source"><button class="source-option active" data-random-source="day" type="button">当天词表</button><button class="source-option" data-random-source="all" type="button">全部词库</button></div>
    <div class="random-body">
      <div class="random-stats"><span>已抽查 <b id="randomTotal">0</b></span><span>认识 <b id="randomKnown">0</b></span><span>不认识 <b id="randomUnknown">0</b></span></div>
      <article class="quiz-card" id="quizCard">
        <button class="quiz-speak" id="randomSpeakBtn" type="button" aria-label="朗读单词"><svg viewBox="0 0 24 24"><path d="M5 10v4h4l5 4V6L9 10H5Z"/><path d="M17 9c1 .8 1.5 1.8 1.5 3S18 14.2 17 15"/><path d="M19 6.5c1.7 1.4 2.5 3.2 2.5 5.5S20.7 16.1 19 17.5"/></svg></button>
        <div class="quiz-label" id="randomSourceLabel">当天词表</div>
        <h3 id="randomWord">—</h3>
        <div class="quiz-answer" id="quizAnswer"><span id="randomPos"></span><p id="randomMeaning"></p></div>
      </article>
      <div class="quiz-actions" id="quizActions">
        <button class="reveal-button" id="revealBtn" type="button">显示释义</button>
        <div class="judge-actions hidden" id="judgeActions"><button class="judge-button unknown" id="unknownBtn" type="button">不认识</button><button class="judge-button known" id="knownBtn" type="button">认识</button></div>
      </div>
      <button class="skip-button" id="skipBtn" type="button">换一个</button>
    </div>
  </section>

  <script src="./words-data.js?v=20260915-2"></script>
  <script src="./app.js?v=focus-2"></script>
  <script src="./random.js?v=random-2"></script>
</body>
</html>
